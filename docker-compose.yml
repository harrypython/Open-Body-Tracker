version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: open-body-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: obtracker
      POSTGRES_PASSWORD: obtracker_secure_password_change_me
      POSTGRES_DB: open_body_tracker
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - obtracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obtracker} -d ${POSTGRES_DB:-open_body_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: open-body-tracker-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://obtracker:obtracker_secure_password_change_me@db:5432/open_body_tracker
      SECRET_KEY: your-secret-key-change-me-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      PHOTO_STORAGE_PATH: /app/photos
    volumes:
      - ./backend:/app
      - ./data/photos:/app/photos
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - obtracker-network
    command: >
      sh -c "until pg_isready -h db -U ${POSTGRES_USER:-obtracker}; do
        echo 'Waiting for database...';
        sleep 2;
      done;
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # React/Vue Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}/api/v1
    container_name: open-body-tracker-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - obtracker-network
    command: npm run dev -- --host 0.0.0.0

networks:
  obtracker-network:
    driver: bridge

volumes:
  postgres_data:
